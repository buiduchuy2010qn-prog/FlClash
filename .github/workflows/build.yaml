name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  dart:
    name: L10n & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate and sync l10n
        run: |
          flutter gen-l10n
          dart format lib/l10n
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$(git status --porcelain lib/l10n)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/l10n
            git commit -m "chore(l10n): regenerate localization files"
            git push origin HEAD:main
          fi

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Run localization, packaging, OTA, 4G, and lint tests
        run: >-
          flutter test
          test/l10n
          test/lint
          test/tool/package_test.dart
          test/models/dns_override_test.dart
          test/common/task_test.dart
          test/common/task_general_override_test.dart
          test/providers/proxies_action_test.dart
          test/views/dashboard/proxy_groups_card_test.dart
          test/common/app_localizations_test.dart
          test/common/app_update_test.dart
          test/common/request_test.dart
          test/common/helpers_test.dart
          test/widgets/update_dialog_test.dart

  build-apk:
    name: Build Android APK
    needs: dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve OTA version and tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-pre\.[0-9]+(\+[0-9]+)?)?$ ]]; then
              echo "::error::$TAG is neither vX.Y.Z nor vX.Y.Z-pre.N[+M]"
              exit 1
            fi
            base="${BASH_REMATCH[1]}"
            committed="$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)"
            build="$(date -u +%Y%m%d%H)"
            if ((build <= ${committed:-0})); then
              build=$((committed + 1))
            fi
            release_tag="$TAG"
          else
            latest_patch="$(git tag -l 'v0.9.*' | sed -n 's/^v0\.9\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)"
            if [ -n "$latest_patch" ]; then
              patch=$((latest_patch + 1))
            else
              patch=7
            fi
            base="0.9.${patch}"
            committed="$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)"
            build="$(date -u +%Y%m%d%H)"
            if ((build <= ${committed:-0})); then
              build=$((committed + 1))
            fi
            release_tag="v${base}"
          fi
          sed "s/^version: .*/version: ${base}+${build}/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "Resolved version: ${base}+${build} | OTA tag: $release_tag"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Signing
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } >> android/local.properties
            keytool -list -keystore android/app/keystore.jks -storepass "${{ secrets.STORE_PASSWORD }}" >/dev/null
          else
            KEYSTORE_PASS="flclash-fallback-$(date +%s)"
            keytool -genkeypair -v \
              -keystore android/app/keystore.jks \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias flclash \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              -dname "CN=FlClash VN, OU=Android, O=buiduchuy2010qn-prog, C=VN"
            {
              echo "keyAlias=flclash"
              echo "storePassword=$KEYSTORE_PASS"
              echo "keyPassword=$KEYSTORE_PASS"
            } >> android/local.properties
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Verify Go Core
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          test -z "$(gofmt -l ./*.go)" || { gofmt -l ./*.go >&2; exit 1; }
          go test -count=1 .
          GOOS=android GOARCH=arm64 go vet -tags=with_gvisor . ./mobile ./tun ./platform

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --tag "${{ env.RELEASE_TAG }}" --env stable -v

      - name: List dist artifacts
        run: ls -lh dist

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-VietHoa-APK
          path: ./dist
          overwrite: true

      - name: Cleanup legacy vi-latest tag
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vi-latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FlClash Việt Hóa Lite ${{ env.RELEASE_TAG }}
          make_latest: true
          body: |
            <!-- flclash:changelog:begin -->
            - Giao diện cập nhật OTA trực quan ngay tại màn hình Giới thiệu: thanh tiến trình mượt, hiện rõ `%`, dung lượng MB đã tải, tốc độ tải thực tế (`MB/s`), trạng thái xác minh chữ ký SHA-256 và trạng thái đang mở trình cài đặt Android.
            - Tự động bật trình cài đặt Android ngay sau khi tải & xác minh xong (giữ lại tệp nếu lỡ bấm hủy để cài lại ngay mà không cần tải lại, kèm nút Xóa tệp APK tức thì).
            - Tự động xóa sạch tệp cài đặt APK & dọn lịch sử trình tải xuống ngay khi cập nhật hoàn tất (`MY_PACKAGE_REPLACED` + kiểm tra dọn lại khi mở app) kèm thông báo dung lượng vừa giải phóng.
            <!-- flclash:changelog:end -->

            ### Hướng dẫn chọn file APK phù hợp:
            - **`android-arm64.apk`**: Điện thoại Android đời mới (64-bit ARMv8) — **Khuyên dùng**.
            - **`android-armv7.apk`**: Điện thoại Android cũ (32-bit ARMv7).
            - **`android-amd64.apk`**: Giả lập Android trên máy tính / thiết bị x86_64.
          files: |
            ./dist/*.apk
            ./dist/FlClash-*-SHA256SUMS
