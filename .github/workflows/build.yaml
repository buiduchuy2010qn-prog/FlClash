name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (all, windows, android)'
        required: false
        default: 'all'
      release_tag:
        description: 'Optional explicit tag (e.g. v0.9.27)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  version:
    name: Resolve Version & Scope
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      app_version: ${{ steps.meta.outputs.app_version }}
      core_changed: ${{ steps.meta.outputs.core_changed }}
      target_platform: ${{ steps.meta.outputs.target_platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and core diff
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-pre\.[0-9]+(\+[0-9]+)?)?$ ]]; then
              echo "::error::$TAG is neither vX.Y.Z nor vX.Y.Z-pre.N[+M]"
              exit 1
            fi
            base="${BASH_REMATCH[1]}"
            release_tag="$TAG"
          elif [ -n "$INPUT_TAG" ]; then
            if [[ ! "$INPUT_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Invalid release_tag $INPUT_TAG"
              exit 1
            fi
            base="${BASH_REMATCH[1]}"
            release_tag="$INPUT_TAG"
          else
            latest_patch="$(git tag -l 'v0.9.*' | sed -n 's/^v0\.9\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)"
            if [ -n "$latest_patch" ]; then
              patch=$((latest_patch + 1))
            else
              patch=7
            fi
            base="0.9.${patch}"
            release_tag="v${base}"
          fi
          committed="$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          build="$(date -u +%Y%m%d%H)"
          if ((build <= ${committed:-0})); then
            build=$((committed + 1))
          fi
          app_version="${base}+${build}"
          target_platform="${INPUT_PLATFORM:-all}"

          latest_tag="$(git tag -l 'v0.9.*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest_tag" ] || ! git diff --quiet "$latest_tag"..HEAD -- core/; then
            core_changed="true"
          else
            core_changed="false"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "core_changed=$core_changed" >> "$GITHUB_OUTPUT"
          echo "target_platform=$target_platform" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$app_version tag=$release_tag core_changed=$core_changed target_platform=$target_platform"

  dart:
    name: L10n & Verify
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate and sync l10n
        run: |
          flutter gen-l10n
          dart format lib/l10n
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$(git status --porcelain lib/l10n)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/l10n
            git commit -m "chore(l10n): regenerate localization files"
            git push origin HEAD:main
          fi

      - name: Format and verify Dart style
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            dart format lib test tool plugins
            if [ -n "$(git status --porcelain lib test tool plugins)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add lib test tool plugins
              git commit -m "style: apply dart format"
              git push origin HEAD:main
            fi
          fi
          dart format --output=none --set-exit-if-changed lib test tool plugins || { dart format lib test tool plugins && git diff -- lib test tool plugins; exit 1; }

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Run localization, packaging, OTA, 4G, and lint tests
        run: >-
          flutter test
          test/l10n
          test/lint
          test/tool/package_test.dart
          test/models/dns_override_test.dart
          test/models/config_test.dart
          test/common/task_test.dart
          test/common/task_general_override_test.dart
          test/common/protocol_test.dart
          test/common/link_test.dart
          test/common/v2ray_link_test.dart
          test/common/daily_traffic_store_test.dart
          test/common/version_gate_test.dart
          test/providers/proxies_action_test.dart
          test/views/dashboard/proxy_groups_card_test.dart
          test/common/app_localizations_test.dart
          test/common/app_update_test.dart
          test/common/request_test.dart
          test/common/helpers_test.dart
          test/widgets/update_dialog_test.dart

  build-android:
    name: Build Android APK (ARM64)
    if: needs.version.outputs.target_platform == 'all' || needs.version.outputs.target_platform == 'android'
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          sed "s/^version: .*/version: $APP_VERSION/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Signing
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } >> android/local.properties
            keytool -list -keystore android/app/keystore.jks -storepass "${{ secrets.STORE_PASSWORD }}" >/dev/null
          else
            echo "::error::Missing KEYSTORE secret; refusing to generate random keystore" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Verify Go Core
        if: needs.version.outputs.core_changed == 'true'
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          test -z "$(gofmt -l ./*.go)" || { gofmt -d ./*.go >&2; exit 1; }
          go test -count=1 .
          GOOS=android GOARCH=arm64 go vet -tags=with_gvisor . ./mobile ./tun ./platform

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android APK (ARM64)
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --arch arm64 --tag "${{ needs.version.outputs.release_tag }}" --env stable -v

      - name: List dist artifacts
        run: ls -lh dist

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  build-windows:
    name: Build Windows (x64)
    if: needs.version.outputs.target_platform == 'all' || needs.version.outputs.target_platform == 'windows'
    needs: version
    runs-on: windows-2022
    steps:
      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
          submodules: recursive

      - name: Apply version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          sed "s/^version: .*/version: $APP_VERSION/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-amd64
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Windows Package
        run: dart tool/package.dart windows --tag "${{ needs.version.outputs.release_tag }}" --env stable -v

      - name: List dist artifacts
        run: Get-ChildItem dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: ./dist
          overwrite: true

  publish:
    name: Publish GitHub Release
    if: always() && needs.version.result == 'success' && needs.dart.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [version, dart, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: artifact-*

      - name: Merge and verify artifacts
        shell: bash
        run: |
          mkdir -p ./dist
          find ./artifacts -maxdepth 2 -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' \) -exec cp -t ./dist {} +
          find ./artifacts -maxdepth 2 -type f -name 'manifest.json' | head -n 1 | xargs -r -I{} cp "{}" ./dist/manifest.json
          sum_name="$(basename "$(find ./artifacts -maxdepth 2 -type f -name 'FlClash-*-SHA256SUMS' | head -n 1)")"
          test -n "$sum_name"
          find ./artifacts -maxdepth 2 -type f -name 'FlClash-*-SHA256SUMS' -exec cat {} + | tr -d '\r' | sort -k2 -u > "./dist/$sum_name"
          (cd dist && sha256sum -c "$sum_name")
          ls -lh dist

      - name: Cleanup legacy vi-latest tag
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vi-latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: FlClash ${{ needs.version.outputs.release_tag }}
          make_latest: ${{ needs.version.outputs.target_platform != 'windows' }}
          body: |
            <!-- flclash:changelog:begin -->
            - Đồng bộ toàn bộ tính năng mới lên Windows PC (v0.9.27): Trung tâm thông minh (Smart Hub), Tự sửa mạng 1 chạm, Kiểm tra đa trang web & ping, Tăng tốc mạng Mixed + mở khóa cửa sổ QUIC/Hysteria2 và System Proxy
            - Quét gói VPN nguy hiểm & Khắc phục 1 chạm, kiểm tra rò rỉ IP/DNS/IPv6, Khiên chống chụp màn hình (WDA_EXCLUDEFROMCAPTURE) và Chia sẻ LAN/Hotspot trực tiếp trên PC
            - Thông báo Windows Action Center khi gói sắp hết hạn, sắp hết dung lượng, vượt số thiết bị hoặc phát hiện rủi ro bảo mật; đồng bộ tài khoản cổng gói & đếm thiết bị online; thống kê lưu lượng 400 ngày trong Smart Hub
            - Tách rời hoàn toàn kênh cập nhật OTA giữa Windows và Android để mỗi nền tảng chỉ nhận đúng bản cập nhật của mình
            <!-- flclash:changelog:end -->

            ### Hướng dẫn chọn file tải phù hợp:
            - **Android (`android-arm64.apk`)**: Điện thoại Android hiện đại (64-bit ARMv8).
            - **Windows cài đặt (`windows-amd64-setup.exe`)**: Máy tính Windows 64-bit — **khuyên dùng**, hỗ trợ tự cập nhật OTA trong app.
            - **Windows Portable (`windows-amd64-portable.zip`)**: Bản giải nén chạy ngay không cần cài đặt.
          files: ./dist/*
